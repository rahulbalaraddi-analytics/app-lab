name: DocSnap build

on:
  push:
    paths:
      - "docsnap/**"
      - ".github/workflows/docsnap.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not resolve|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocSnap-debug-apk
          path: docsnap/app/build/outputs/apk/debug/app-debug.apk
