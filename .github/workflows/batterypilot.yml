name: BatteryPilot build

on:
  push:
    paths:
      - "batterypilot/**"
      - ".github/workflows/batterypilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batterypilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BatteryPilot-debug-apk
          path: batterypilot/app/build/outputs/apk/debug/app-debug.apk

      # Direct phone download link: github.com/<repo>/releases/tag/batterypilot-latest
      - name: Publish "latest" release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BatteryPilot.apk
          gh release delete batterypilot-latest -y --cleanup-tag || true
          gh release create batterypilot-latest BatteryPilot.apk \
            --title "BatteryPilot (latest build)" \
            --notes "Debug build from ${GITHUB_SHA::7}. Open this page on your phone and tap BatteryPilot.apk to install." \
            --prerelease

      # Keeps a readable build log on a side branch (useful when the build fails)
      - name: Save build log
        if: always()
        run: |
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b ci/batterypilot-log
          { echo "status: $STATUS"; echo "commit: $GITHUB_SHA"; echo; \
            grep -E "^e: |error:|FAILED|What went wrong|BUILD (SUCCESSFUL|FAILED)|warning:.*unused" -A3 "$GITHUB_WORKSPACE/batterypilot/build.log" | head -400; } > summary.txt
          tail -300 "$GITHUB_WORKSPACE/batterypilot/build.log" > tail.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log $GITHUB_SHA ($STATUS)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci/batterypilot-log
