name: Nidra build

on:
  push:
    paths:
      - "nidra/**"
      - ".github/workflows/nidra.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nidra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nidra-debug-apk
          path: nidra/app/build/outputs/apk/debug/app-debug.apk
      # Direct phone download link: github.com/<repo>/releases/tag/nidra-latest
      - name: Publish APK to the nidra-latest download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nidra.apk
          gh release view nidra-latest >/dev/null 2>&1 || \
            gh release create nidra-latest --prerelease --title "Nidra test build" \
              --notes "Latest Nidra test build. Open this page on the phone, tap Nidra.apk, install."
          gh release upload nidra-latest Nidra.apk --clobber
