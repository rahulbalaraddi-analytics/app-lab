name: IdeaDrop build

on:
  push:
    paths:
      - "ideadrop/**"
      - ".github/workflows/ideadrop.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ideadrop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IdeaDrop-debug-apk
          path: ideadrop/app/build/outputs/apk/debug/app-debug.apk
